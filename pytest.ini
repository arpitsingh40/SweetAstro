[pytest]
# Scope: bare `pytest` runs ONLY this project's suite (never scans parent folders).
testpaths = tests
# Plugin pruning: the suite uses neither unittest.TestCase, doctests, --pdb,
# nor stepwise mode; disabling their plugins cuts ~0.3 s of import time per run.
addopts = -ra --durations=10 --strict-markers -p no:debugging -p no:unittest -p no:doctest -p no:stepwise
markers =
    slow: heavier end-to-end tests (skipped by the fast dev loop)

# Hang protection: any single test that exceeds 60 s is killed with a stack
# dump naming the test; the whole run is additionally watchdogged by dev.ps1.
timeout = 60
timeout_method = thread

filterwarnings =
    ignore::DeprecationWarning
